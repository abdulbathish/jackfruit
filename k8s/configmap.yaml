apiVersion: v1
kind: ConfigMap
metadata:
  name: mosip-odte-config
data:
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_GROUP_ID: "mosip-odte-group"
  KAFKA_TOPIC: "ondemand-template-extraction"
  
  # Database Configuration
  DB_URL: "jdbc:postgresql://postgres:5432/mosip"
  DB_USERNAME: "postgres"
  
  # Application Configuration
  LOG_LEVEL: "INFO"
  
  # Add other configuration parameters as needed 